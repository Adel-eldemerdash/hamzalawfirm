<!--
  Shared head markup, injected into every page by headerInjection() in
  webpack.config.js. The canonical placeholder is substituted per page, so
  every absolute URL below resolves the same way from any depth of route.

  Icons and the manifest use root-relative paths, which resolve from any
  depth of route and on any host. og:image and the structured data keep
  absolute URLs, which social scrapers and schema.org both require.

  Route-relative paths must not appear here. This file is injected into pages served
  from /, /ourFirm, /services/<slug>, and /pdpl-checklist alike, and a "./"
  path resolves against the route, not the site root — which is how the
  favicon and the social images came to 404 on every page but the home page.
-->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
<meta name="author" content="Hamza &amp; Partners Law Firm" />
<meta name="theme-color" content="#6c5735" />

<!-- Icons. Square tiles cropped from the firm's mark; the source logo is
     519x821 and rendered as a browser tab icon it was squeezed thin. -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon-180.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Open Graph -->
<meta property="og:site_name" content="Hamza &amp; Partners Law Firm" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="en_US" />
<meta property="og:locale:alternate" content="ar_EG" />
<meta property="og:url" content="<%= htmlWebpackPlugin.options.canonical %>" />
<meta property="og:image" content="https://www.hamzalawfirm.com/assets/images/icon-512.png" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta property="og:image:alt" content="Hamza &amp; Partners Law Firm" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://www.hamzalawfirm.com/assets/images/icon-512.png" />
